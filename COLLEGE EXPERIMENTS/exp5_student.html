<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Personal Information</title>
</head>

<body>
    <form action="submit_form.php" method="post">
        
            <h1 align="center">Student Registration Form</h1>
            <hr>

            <label for="name">FULL NAME:</label>
            <input type="text" id="name" name="name" placeholder="Enter Your Full Name" required><br><br>

            <label for="email">EMAIL:</label>
            <input type="email" id="email" name="email" placeholder="Enter Your Email" required><br><br>

            <label for="password">PASSWORD:</label>
            <input type="password" id="password" name="password" placeholder="Enter Your Password" required><br><br>

            <label for="gender">GENDER:</label>
            <input type="radio" id="gender" name="gender" value="male" required>
            <label for="gender">Male</label>
            <input type="radio" id="gender" name="gender" value="female" required>
             <label for="gender">Female</label>
             <input type="radio" id="gender" name="gender" value="other" required>
             <label for ="gender">Other</label>
            <br><br>
            
            <label for ="course">COURSE:</label>
            <select id="course" name="course"  placeholder="--Select Your Course--" required>
                <option value="" disabled selected>--Select Your Course--</option>
                <option value="BTECH">BTECH </option>
                <option value="MTECH">MTECH</option>
                <option value="BCA">BCA</option>
                <option value="MCA">MCA</option>
                <option value="BBA">BBA</option>
            </select>
            <br><br>
            <label for="contact no.">Contact no:</label>
            <input type="tel" id="contact no." name="contact no." placeholder="Enter Phone Number" required>
            <br><br>
            <label for="address">Address:</label><br>
            <textarea id="address" name="address" placeholder="Enter Your Address" required rows="4" cols="40"></textarea>
            <br><br>
            <input type="submit" value="Register">
            <button type="reset" value="Reset">Reset</button>
            <hr>
            <p align="center">&copy; 2025 Student Registration Portal</p>
    </form>
    

</body>

</html>
