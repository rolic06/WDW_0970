<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

</head>

<body>
    <center>
        <h1
            style="color:rgb(233, 233, 237); font-size: 50px; font-family: Arial, sans-serif; background-color: rgb(7, 7, 160) ">
            ABC College Admission 2026
        </h1>
    </center>
    <pre>

    <h1 style="font-size: 40px;">            Course and Fees</h1></pre>
    <center>
        <table border="1" height="50" width="50%" cellpadding="5" cellspacing="0">
            <caption> Available Courses</caption>

                    <th>Fees</th>

            <tbody>
                <tr>
                    <td>B.Tech CSE</td>
                    <td>120</td>
                    <td>&#8377;90,000</td>

                <tr>

        </table>

            <br><br>
            <label for="email">Email:</label><br>
            <input type="email" id="email" name="email">
            <br><br>
            <label for="course">Course:</label><br>
            <select value="course">
                <option>B.Tech CSE</option>
                <option>B.Tech ECE</option>
                <option>B.Tech ME</option>
            </select><br><br>

            <label for="Statement:">Statement</label><br>
            <textarea  value="text" rows="3" cols="40"></textarea>
            <br><br>
            <button type="apply" value="apply">Apply</button>




    </form>



</body>
